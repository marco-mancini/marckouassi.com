name: Publier le portfolio sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Restaurer le cache des médias
        uses: actions/cache@v4
        with:
          path: .cache/medias
          key: medias-pages-${{ github.run_id }}
          restore-keys: medias-
      - name: Vérifier le code
        run: npm test
      # Le site est GÉNÉRÉ à partir de content/ par les gabarits du Design System.
      - name: Construire le site
        env:
          ADMIN_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          ADMIN_SUPABASE_CLE_PUBLIQUE: ${{ vars.SUPABASE_CLE_PUBLIQUE }}
        run: npm run build
      - name: Téléverser le site statique
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
